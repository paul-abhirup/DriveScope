[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivescope"
version = "0.1.0"
description = "Experiment infrastructure for evaluating Vision-Language-Action (VLA) agents"
readme = "README.md"
authors = [
    { name = "DriveScope Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "scipy>=1.12.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "flake8>=7.0.0",
    "black>=24.2.0",
    "mypy>=1.9.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*", "models*", "evaluation*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests"
]
pythonpath = ["."]
asyncio_mode = "auto"
